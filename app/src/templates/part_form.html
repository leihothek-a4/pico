{% extends "base.html" %}
{% block title %}{{ submit_label or "Save" }} part{% endblock %}
{% block content %}
    <h1>{{ submit_label or "Save" }} part{% if part %} "{{ part.name }}"{% endif %}</h1>
    <p>
        <small>{% if locker %}Locker {{ locker.id }}, {% endif %}item {{ item.name }}</small>
    </p>
    <form method="post">
        <label for="name">Part name</label>
        <input type="text" id="name" name="name" required value="{{ name or '' }}">
        <label for="uid">
            RFID / NFC UID
            <small>(4–10 bytes hex, e.g. A7 A0 C8 01 — used by the Pico reader)</small>
        </label>
        <input
            type="text"
            id="uid"
            name="uid"
            value="{{ uid or '' }}"
            placeholder="A7 A0 C8 01"
            autocomplete="off"
            spellcheck="false"
        >
        <p>
            <button type="submit">{{ submit_label or "Save" }}</button>
            <a href="{{ url_for("mainpage") }}">Cancel</a>
        </p>
    </form>
{% endblock %}
